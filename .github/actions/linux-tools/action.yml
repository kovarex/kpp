# The Linux jobs' tools (ci.yml's linux_build, linux_spec and linux_host): clang 19, lld, Ninja and
# CMake, and upstream SDL 3.4.18's headers for the two interop snippets that import SDL3/SDL.h.
# Sets KPP_CLANG and KPP_SDL_INCLUDE for the job's later steps, and DEBS_FETCHED=1 when the packages
# came from the mirror, for linux_build alone to save them (one key per run: the matrix's jobs saving
# under it would collide).
#
# Clang 19, as the bundled toolchain's (kpp's IR names LLVM 19's intrinsics: clang 18, Ubuntu
# 24.04's default, links llvm.eh.typeid.for.p0 as an undefined symbol), and its lld; kpp takes
# it through KPP_CLANG, and clang-19's ld.lld is beside it.
# (apt with time limits, tried 3 times: on 2026-11-06 an Ubuntu mirror held apt-get for 40 minutes
# and the job hit its 45, run 42171827019, and gave 50 KB/s for two more runs, which hit the step's
# 20, 42206507772 and 42208289662. So the .deb files are kept by actions/cache and a hit installs
# them with no mirror. Any that no longer install, the image having moved on, go the mirror's
# way, and that run's files are saved under its own key, the newest being the one restored.
# dpkg, not apt-get: given the files, apt-get fetched all 16 from the mirror again on image
# 20261101.360 and timed out, run 42273619572.)
name: linux tools
description: clang 19, lld, ninja, cmake (cached .deb files) and SDL3's headers
runs:
  using: composite
  steps:
    - name: Packages cache
      uses: actions/cache/restore@v4
      with:
        path: ~/debs
        key: linux-host-debs-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: linux-host-debs-

    - name: Tools
      shell: bash
      run: |
        apt="-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Keep-Downloaded-Packages=true"
        mkdir -p ~/debs
        if ls ~/debs/*.deb >/dev/null 2>&1 && timeout 300 sudo dpkg -i ~/debs/*.deb; then
          echo "installed from the cache: $(ls ~/debs | wc -l) packages"
        else
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update $apt && timeout 600 sudo apt-get install -y $apt clang-19 lld-19 ninja-build cmake; then break; fi
            [ "$attempt" -lt 3 ] || { echo "apt-get failed 3 times"; exit 1; }
            echo "apt-get attempt $attempt failed; again in 30 s"
            sleep 30
          done
          rm -f ~/debs/*.deb
          cp /var/cache/apt/archives/*.deb ~/debs/
          echo "DEBS_FETCHED=1" >> "$GITHUB_ENV"
        fi
        echo "KPP_CLANG=/usr/bin/clang-19" >> "$GITHUB_ENV"
        clang-19 --version | head -n 1
        /usr/lib/llvm-19/bin/ld.lld --version
        echo "CPUs: $(nproc)"

    # Upstream SDL 3.4.18's headers, as ci.yml's spec job has them: SDL's release, kept by actions/cache
    # under its SHA-256 (pinned-download).
    - name: SDL3's zip
      id: sdl-zip
      uses: ./.github/actions/pinned-download
      with:
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
        sha256: 78d84602ae616cfe26b33a73b7d3b9b6b56e8a6650e53d92c9c6ca938f747acd
        name: SDL3-devel-3.4.18-VC.zip

    - name: SDL3 headers
      shell: bash
      run: |
        dir="$RUNNER_TEMP/sdl"
        mkdir -p "$dir"
        unzip -q "${{ steps.sdl-zip.outputs.file }}" 'SDL3-3.4.18/include/*' -d "$dir"
        test -f "$dir/SDL3-3.4.18/include/SDL3/SDL.h"
        echo "KPP_SDL_INCLUDE=$dir/SDL3-3.4.18/include" >> "$GITHUB_ENV"
