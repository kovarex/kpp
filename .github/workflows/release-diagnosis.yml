# Thread H, 2026-11-02 (temporary): which release call the job's token is refused. ci.yml's and
# release.yml's runs get 403 "Resource not accessible by integration" creating a release, although
# the token has Contents: write. Started by hand; deleted once the cause is known.
name: release-diagnosis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: publish.ps1 with a throwaway tag, then with latest
        shell: powershell
        env:
          KPP_FORGE_TOKEN: ${{ github.token }}
        run: |
          foreach ($tag in "diagnosis-${{ github.run_id }}", 'latest') {
            Write-Host "== $tag"
            try {
              tools\release\publish.ps1 -ApiUrl "${{ github.api_url }}" -Repository "${{ github.repository }}" -Tag $tag -Commit "${{ github.sha }}" -Prerelease `
                -Version 0.0.0-diagnosis -Title "diagnosis ($tag)" -Notes "A test of the release calls; deleted at once." -Files README.md
            } catch { Write-Host "FAILED: $($_.Exception.Message) $($_.ErrorDetails.Message)" }
          }
          $headers = @{ Authorization = "Bearer $env:KPP_FORGE_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "${{ github.api_url }}/repos/${{ github.repository }}"
          foreach ($r in (Invoke-RestMethod -Headers $headers "$api/releases?per_page=100")) {
            if ($r.name -like 'diagnosis*') {
              Invoke-RestMethod -Method DELETE -Headers $headers "$api/releases/$($r.id)" | Out-Null
              try { Invoke-RestMethod -Method DELETE -Headers $headers "$api/git/refs/tags/$($r.tag_name)" | Out-Null } catch {}
              Write-Host "deleted $($r.tag_name)"
            }
          }
