# kpp's tests on a Windows runner (docs/build.md, "Continuous integration"): kppc built by
# compiler\build.cmd, then compiler\tests\run_tests.cmd and compiler\tests\spec.cmd. Every push to
# master and every pull request runs the debug spec; the nightly run (and one started by hand) adds
# --release and --debug-info (kovarex, 2026-10-31). programs\factorio\convert.cmd is left out: it
# needs C:\Factorio, private game source that is not on the runner (factorio-in-kpp's own CI covers
# the game). A green run on master publishes the package (zip, installer, VS Code extension) as the
# rolling prerelease "latest", which factorio-in-kpp's CI downloads; a green nightly run also publishes
# it as the numbered prerelease v0.1.<date> (kovarex, 2026-11-02). release.yml stays for releases by hand.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC: 20:17 PDT, 04:17 CET; outside 06:00-09:00 Pacific
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older run still going, so runs never queue back to back; the nightly and
# hand-started runs have groups of their own, so a push does not cancel them.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit of a pull request is signed off by its author (CONTRIBUTING.md, "Sign-off"). On a
  # Linux runner, whose minutes cost half a Windows runner's; a Forgejo runner's label through the
  # repository variable KPP_CI_LINUX_RUNNER.
  signoff:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.KPP_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Signed-off-by on every commit
        shell: sh
        run: sh tools/ci/check-signoff.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  windows:
    # A GitHub-hosted runner by default; a Forgejo runner's label through the repository variable
    # KPP_CI_RUNNER.
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 120
    env:
      # Upstream SDL 3.4.18's headers stand in for C:\Factorio\libraries\SDL3\include (the same release;
      # the game's copy adds one function) for the two interop snippets that import SDL3/SDL.h. The zip
      # comes from kpp.net's mirror (kppnet/registry/layout.md), named by its SHA-256, or from SDL's
      # release on github.com until it is mirrored there.
      SDL_NAME: SDL3-devel-3.4.18-VC.zip
      SDL_SHA256: 78d84602ae616cfe26b33a73b7d3b9b6b56e8a6650e53d92c9c6ca938f747acd
      SDL_FALLBACK: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
      KPP_SDL_INCLUDE: ${{ github.workspace }}\..\sdl\SDL3-3.4.18\include
    # Steps are scripts (Windows PowerShell 5.1, cmd) except the checkout, so the same file runs under
    # GitHub Actions and Forgejo Actions (docs/build.md, "Continuous integration").
    steps:
      - uses: actions/checkout@v4

      # kpp.net's registry store is written over SSH by tools/release/publish.ps1 (docs/build.md,
      # "Continuous integration"), only in the two steps that need it: the secret KPP_NET_SSH_KEY (a
      # private key kovarex authorises in NFS's keychain), the repository variables KPP_NET_SSH
      # (user@host) and KPP_NET_KNOWN_HOSTS (the server's host key line). Without the secret, nothing
      # goes to kpp.net and the step says so.
      - name: SDL3 headers
        shell: powershell
        env:
          KPP_NET_SSH_KEY: ${{ secrets.KPP_NET_SSH_KEY }}
          KPP_NET_KNOWN_HOSTS: ${{ vars.KPP_NET_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "${{ github.workspace }}\..\sdl"
          if (-not (Test-Path "$env:KPP_SDL_INCLUDE\SDL3\SDL.h")) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
            $zip = "$dir\$env:SDL_NAME"
            function Fetch([string]$url) {
              try { Invoke-WebRequest $url -OutFile $zip -UseBasicParsing } catch { Write-Host "not at $url ($($_.Exception.Message))"; return $false }
              $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
              if ($hash -ne $env:SDL_SHA256) { Write-Host "$url has SHA-256 $hash, not $env:SDL_SHA256"; return $false }
              Write-Host "SDL3 from $url"; return $true
            }
            if (-not (Fetch "https://kpp.net/registry/mirror/$env:SDL_SHA256/$env:SDL_NAME")) {
              if (-not (Fetch $env:SDL_FALLBACK)) { throw 'no SDL3 zip with the expected SHA-256' }
              # Not mirrored yet: a master run with kpp.net's key puts it there (once; it is kept after).
              if ('${{ github.event_name }}' -ne 'pull_request' -and '${{ github.ref }}' -eq 'refs/heads/master') {
                tools\release\publish.ps1 -Mirror -KppNet "${{ vars.KPP_NET_SSH }}" -Files $zip
              }
            }
            Expand-Archive -Force $zip $dir
          }
          if (-not (Test-Path "$env:KPP_SDL_INCLUDE\SDL3\SDL.h")) { throw "no SDL3\SDL.h in $env:KPP_SDL_INCLUDE" }

      # Clang for the snippets' C sources (the runner's Visual Studio need not be Community), and
      # Node.js for run_tests' LSP smoke test and the package's VS Code extension (npm ci, vsce).
      - name: Tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the Clang component' }
          "KPP_CLANG=$vs\VC\Tools\Llvm\x64\bin\clang.exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'no Node.js on the runner' }

      - name: Build kppc
        shell: cmd
        run: compiler\build.cmd

      - name: run_tests
        shell: cmd
        run: compiler\tests\run_tests.cmd

      - name: spec
        shell: cmd
        run: compiler\tests\spec.cmd --no-doc

      - name: spec --release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: compiler\tests\spec.cmd --no-doc --release

      - name: spec --debug-info
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: compiler\tests\spec.cmd --no-doc --debug-info

      # The package's version: the nightly run's is a numbered release, 0.1.<date> (UTC), and it is
      # also published under its own tag; any other run's is 0.1.0-ci.<run> (semver, which vsce needs).
      - name: Version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ('${{ github.event_name }}' -eq 'schedule') { '0.1.' + (Get-Date).ToUniversalTime().ToString('yyyyMMdd') } else { '0.1.0-ci.${{ github.run_number }}' }
          "KPP_VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "version $version"

      # Inno Setup's compiler, for the installer package.ps1 makes when it finds ISCC (as release.yml).
      - name: Inno Setup
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw 'no Inno Setup' }

      - name: Package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $started = Get-Date
          tools\release\package.ps1 -Version $env:KPP_VERSION -Commit "${{ github.sha }}"
          if (-not (Test-Path "build\release\kpp-$env:KPP_VERSION-setup.exe")) { throw 'no installer' }
          "packaging took $([int]((Get-Date) - $started).TotalSeconds) s"

      # The package, through tools/release/publish.ps1: the forge's rolling prerelease "latest", replaced
      # at this commit through the forge's API (GitHub's, or Forgejo's when github.api_url ends in
      # /api/v1), and kpp.net's kpp/releases/<version>/ with kpp/latest.json, which installers and
      # factorio-in-kpp's CI read (only with KPP_NET_SSH_KEY).
      - name: Publish latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: powershell
        env:
          KPP_FORGE_TOKEN: ${{ github.token }}
          KPP_NET_SSH_KEY: ${{ secrets.KPP_NET_SSH_KEY }}
          KPP_NET_KNOWN_HOSTS: ${{ vars.KPP_NET_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:KPP_VERSION
          tools\release\publish.ps1 -ApiUrl "${{ github.api_url }}" -Repository "${{ github.repository }}" -Tag latest -Commit "${{ github.sha }}" -Prerelease `
            -Version $v -KppNet "${{ vars.KPP_NET_SSH }}" `
            -Title "Kpp latest ($v)" `
            -Notes "Built by ci run ${{ github.run_number }} from ${{ github.sha }}, every test green. Install with kpp-$v-setup.exe (Program Files\Kpp, on PATH), or unzip kpp-$v.zip anywhere. Needs Visual Studio 2022 with C++ Clang Compiler for Windows. kpp.vsix is the VS Code extension." `
            -Files "build\release\kpp-$v.zip", "build\release\kpp-$v-setup.exe", "build\release\kpp\kpp.vsix"

      # The nightly run's package again, as the numbered prerelease v0.1.<date> on the forge (kpp.net
      # already has it under releases/<version>/ from the step above). No second build or package.
      - name: Publish numbered
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/master'
        shell: powershell
        env:
          KPP_FORGE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:KPP_VERSION
          tools\release\publish.ps1 -ApiUrl "${{ github.api_url }}" -Repository "${{ github.repository }}" -Tag "v$v" -Commit "${{ github.sha }}" -Prerelease `
            -Version $v -Title "Kpp $v" `
            -Notes "The nightly build of ${{ github.sha }} (ci run ${{ github.run_number }}), every test green, including the --release and --debug-info spec. Install with kpp-$v-setup.exe (Program Files\Kpp, on PATH), or unzip kpp-$v.zip anywhere. Needs Visual Studio 2022 with C++ Clang Compiler for Windows. kpp.vsix is the VS Code extension." `
            -Files "build\release\kpp-$v.zip", "build\release\kpp-$v-setup.exe", "build\release\kpp\kpp.vsix"
