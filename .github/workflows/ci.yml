# kpp's tests on a Windows runner (docs/build.md, "Continuous integration"): kppc built by
# compiler\build.cmd, then compiler\tests\run_tests.cmd and compiler\tests\spec.cmd. Every push to
# master and every pull request runs the debug spec; the nightly run (and one started by hand) adds
# --release and --debug-info (kovarex, 2026-10-31). programs\factorio\convert.cmd is left out: it
# needs C:\Factorio, private game source that is not on the runner (factorio-in-kpp's own CI covers
# the game). A green run on master publishes the package as the rolling prerelease "latest", which
# factorio-in-kpp's CI downloads; release.yml stays for numbered releases.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC: 20:17 PDT, 04:17 CET; outside 06:00-09:00 Pacific
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older run still going, so runs never queue back to back; the nightly and
# hand-started runs have groups of their own, so a push does not cancel them.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # A GitHub-hosted runner by default; a Forgejo runner's label through the repository variable
    # KPP_CI_RUNNER.
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 120
    env:
      # Upstream SDL 3.4.18's headers stand in for C:\Factorio\libraries\SDL3\include (the same release;
      # the game's copy adds one function) for the two interop snippets that import SDL3/SDL.h.
      SDL_ZIP: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
      KPP_SDL_INCLUDE: ${{ github.workspace }}\..\sdl\SDL3-3.4.18\include
    # Steps are scripts (Windows PowerShell 5.1, cmd) except the checkout, so the same file runs under
    # GitHub Actions and Forgejo Actions (docs/build.md, "Continuous integration").
    steps:
      - uses: actions/checkout@v4

      - name: SDL3 headers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "${{ github.workspace }}\..\sdl"
          if (-not (Test-Path "$env:KPP_SDL_INCLUDE\SDL3\SDL.h")) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
            Invoke-WebRequest $env:SDL_ZIP -OutFile "$dir\sdl.zip" -UseBasicParsing
            Expand-Archive -Force "$dir\sdl.zip" $dir
          }
          if (-not (Test-Path "$env:KPP_SDL_INCLUDE\SDL3\SDL.h")) { throw "no SDL3\SDL.h in $env:KPP_SDL_INCLUDE" }

      # Clang for the snippets' C sources (the runner's Visual Studio need not be Community), and
      # Node.js for run_tests' LSP smoke test and the package's VS Code extension (npm ci, vsce).
      - name: Tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the Clang component' }
          "KPP_CLANG=$vs\VC\Tools\Llvm\x64\bin\clang.exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'no Node.js on the runner' }

      - name: Build kppc
        shell: cmd
        run: compiler\build.cmd

      - name: run_tests
        shell: cmd
        run: compiler\tests\run_tests.cmd

      - name: spec
        shell: cmd
        run: compiler\tests\spec.cmd --no-doc

      - name: spec --release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: compiler\tests\spec.cmd --no-doc --release

      - name: spec --debug-info
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: compiler\tests\spec.cmd --no-doc --debug-info

      - name: Package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $started = Get-Date
          tools\release\package.ps1 -Version "0.1.0-ci.${{ github.run_number }}" -Commit "${{ github.sha }}"
          "packaging took $([int]((Get-Date) - $started).TotalSeconds) s"

      # The rolling prerelease "latest", replaced at this commit with the zip, through the forge's own
      # API (tools/release/publish.ps1: GitHub's, or Forgejo's when github.api_url ends in /api/v1).
      - name: Publish latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: powershell
        env:
          KPP_FORGE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          tools\release\publish.ps1 -ApiUrl "${{ github.api_url }}" -Repository "${{ github.repository }}" -Tag latest -Commit "${{ github.sha }}" -Prerelease `
            -Title "Kpp latest (0.1.0-ci.${{ github.run_number }})" `
            -Notes "Built by ci run ${{ github.run_number }} from ${{ github.sha }}, every test green. Unzip anywhere; needs Visual Studio 2022 with C++ Clang Compiler for Windows." `
            -Files "build\release\kpp-0.1.0-ci.${{ github.run_number }}.zip"
