# kpp's tests on Windows runners (docs/build.md, "Continuous integration"): kpp built once by
# compiler\build.cmd, then compiler\tests\run_tests.cmd and compiler\tests\spec.cmd in 4 shards, as
# parallel jobs (kovarex, 2026-11-02: the repository is public, so its runners cost nothing). Every
# push to master and every pull request runs every job: run_tests --full, the spec in debug, --release
# and --debug-info, and the FreeBSD VM jobs (kovarex, 2026-11-05: "having all the tests in CI is fine,
# as they don't block pushing more things"). programs\factorio\convert.cmd is left out: it
# needs C:\Factorio, private game source that is not on the runner (factorio-in-kpp's own CI covers
# the game). Every green run on master (push, nightly or by hand) publishes the package (zip,
# installer, VS Code extension) as a numbered full release, GitHub's "Latest" (releases/latest and the
# repository's sidebar; kovarex, 2026-11-02), which factorio-in-kpp's CI downloads. release.yml stays
# for releases by hand.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC: 20:17 PDT, 04:17 CET; outside 06:00-09:00 Pacific
  workflow_dispatch:

permissions:
  contents: write

# One run at a time per trigger and branch. A push run that has started finishes, so a green one
# publishes; only one more waits, the newest push's (GitHub cancels an older waiting run).
# On 2026-11-01 almost every push run was cancelled by the next push before it could publish
# (kovarex had chosen cancelling on 2026-10-31; the coordinator changed it on 2026-11-02). A pull
# request's newer push still cancels its older run. The nightly and hand-started runs have groups of
# their own, so a push does not cancel them.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The jobs run on a GitHub-hosted Windows runner by default, a Forgejo runner's label through
  # the repository variable KPP_CI_RUNNER. kpp is built once (build) and handed to the test jobs as
  # the artifact "kpp"; run_tests' 2 halves, the spec's shards and (on master) package run at once;
  # publish runs only when every one of them is green, so a red run publishes nothing
  # (docs/build.md, "Continuous integration"). Steps are scripts
  # (Windows PowerShell 5.1, cmd) except checkout, cache and the artifact's upload and download.
  build:
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 30
    env:
      # ccache 4.10.2 (pinned, SHA-256 checked) compiles through a cache kept by actions/cache, keyed on
      # the compiler's sources; a checkout gives every file a new time, so Ninja alone rebuilds all.
      # (Cached directories are under runner.workspace, the checkout's parent: actions/cache refuses a
      # path with "..". The runner context exists only in steps, not in a job's env, so CCACHE_DIR and
      # KPP_SDL_INCLUDE are set by a step.)
      CCACHE_URL: https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
      CCACHE_SHA256: 6252f081876a9a9f700fae13a5aec5d0d486b28261d7f1f72ac11c7ad9df4da9
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    steps:
      # The whole history: kpp's version counts the commits since VERSION last changed
      # (compiler/version.cmake; a shallow clone without that commit fails the build).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}\ccache
          key: ccache-${{ hashFiles('compiler/src/**', 'compiler/CMakeLists.txt', 'compiler/*.cmake') }}
          restore-keys: ccache-

      # (its zip kept by actions/cache under its SHA-256: GitHub's release download answered 504 on
      # 2026-11-08 and failed the build job of three pushes)
      - name: ccache's zip
        id: ccache-zip
        uses: ./.github/actions/pinned-download
        with:
          url: ${{ env.CCACHE_URL }}
          sha256: ${{ env.CCACHE_SHA256 }}
          name: ccache-4.10.2-windows-x86_64.zip

      - name: ccache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dir = "${{ runner.workspace }}\ccache-tool"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Expand-Archive -Force "${{ steps.ccache-zip.outputs.file }}" $dir
          $exe = (Resolve-Path "$dir\ccache-4.10.2-windows-x86_64\ccache.exe").Path
          "KPP_CCACHE=$exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "CCACHE_DIR=${{ runner.workspace }}\ccache" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "CPUs: $env:NUMBER_OF_PROCESSORS"

      # compiler\llvm.ps1's directory for the pinned release (lib\LLVM*.lib and LLVM's headers, 256 MB of
      # the 845 MB archive), kept by actions/cache under the release's SHA-256, which llvm.ps1 pins and
      # checks: a hosted runner is a fresh machine, so without it every run downloads the archive.
      - name: LLVM pin
        id: llvm-pin
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content -Raw compiler\llvm.ps1) -notmatch "\`$sha256 = '([0-9A-F]{64})'") { throw 'no pinned SHA-256 in compiler\llvm.ps1' }
          "sha256=$($Matches[1])" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "LLVM release $($Matches[1])"

      - name: LLVM cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}\llvm\${{ steps.llvm-pin.outputs.sha256 }}
          key: llvm-${{ steps.llvm-pin.outputs.sha256 }}

      # LLVM's libraries for the back end inside kpp (compiler\llvm.ps1: the pinned release, its
      # SHA-256 checked, unpacked under that hash outside the workspace); build.cmd links them in
      # (KPP_LLVM_DIR), and run_tests' "LLVM back end" checks that path.
      - name: LLVM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = powershell -NoProfile -ExecutionPolicy Bypass -File compiler\llvm.ps1 -Out "${{ runner.workspace }}\llvm" | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw 'compiler\llvm.ps1 failed' }
          "KPP_LLVM_DIR=$llvm" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build kpp
        shell: cmd
        run: |
          rem (call: a batch file run without it never returns to this one)
          call compiler\build.cmd || exit /b 1
          "%KPP_CCACHE%" --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: kpp
          path: compiler/build/kpp.exe
          retention-days: 3
          if-no-files-found: error

  # run_tests in 2 halves at once (run_tests.cmd --part 1|2: part 2 is determinism, concurrency,
  # generate, project and format ours, about 2 minutes either way), in full (--full): what a thread's quick
  # gate leaves out before its push (concurrency, incremental, windows-gnu, format ours, determinism's full mode) runs
  # here on every push.
  run_tests:
    needs: build
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    name: run_tests ${{ matrix.part }}/2
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kpp
          path: compiler/build

      # llvm-mingw (tests\toolchain.ps1, windowsgnu.ps1; tools\sysroot\llvm-mingw.ps1 pins it by
      # SHA-256 and checks it), kept unpacked under the script's hash.
      - name: llvm-mingw cache
        uses: actions/cache@v4
        with:
          path: build/llvm-mingw
          key: llvm-mingw-${{ hashFiles('tools/sysroot/llvm-mingw.ps1') }}

      # Debian 11's sysroot for tests\targets.ps1 (part 1), kept under the script's hash (which pins
      # every package's SHA-256; the sysroot's stamp names them): a cache hit downloads nothing from
      # Debian's mirrors.
      - name: Linux sysroot cache
        if: matrix.part == 1
        uses: actions/cache@v4
        with:
          path: compiler/build/sysroots/linux-x86_64
          key: linux-sysroot-${{ hashFiles('tools/sysroot/linux.ps1') }}

      # Clang for the C sources (the runner's Visual Studio need not be Community), and Node.js for
      # the LSP smoke test.
      - name: Tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the Clang component' }
          "KPP_CLANG=$vs\VC\Tools\Llvm\x64\bin\clang.exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "CPUs: $env:NUMBER_OF_PROCESSORS"
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'no Node.js on the runner' }

      - name: run_tests
        shell: cmd
        run: compiler\tests\run_tests.cmd --full --part ${{ matrix.part }}

  # The spec in shards (run_spec.py --shard I/N), in debug, --release, --debug-info and windows-gnu on
  # every run: debug in 2 (1.2-1.9 min a shard in 4, 2026-11-08), the others in 4; 14 jobs at once,
  # leaving more of GitHub's 20 jobs at a time to the Linux jobs, which waited for them.
  spec:
    needs: build
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    name: spec ${{ matrix.config }} ${{ matrix.shard }}/${{ matrix.config == 'debug' && 2 || 4 }}
    strategy:
      fail-fast: false
      matrix:
        # (windows-gnu: --target windows-gnu --release, what an installation's `kpp --release` builds, as
        # the bundled toolchain is its default: until 2026-11-06 only debug builds of tests\run met that
        # configuration, and its globals were built in reverse for four days)
        config: [debug, release, debug-info, windows-gnu]
        shard: [1, 2, 3, 4]
        exclude:
          - { config: debug, shard: 3 }
          - { config: debug, shard: 4 }
    env:
      # Upstream SDL 3.4.18's headers stand in for C:\Factorio\libraries\SDL3\include (the same release;
      # the game's copy adds one function) for the two interop snippets that import SDL3/SDL.h. The zip
      # is SDL's release on github.com, kept by actions/cache under its SHA-256 (pinned-download).
      SDL_NAME: SDL3-devel-3.4.18-VC.zip
      SDL_SHA256: 78d84602ae616cfe26b33a73b7d3b9b6b56e8a6650e53d92c9c6ca938f747acd
      SDL_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kpp
          path: compiler/build

      - name: SDL3's zip
        id: sdl-zip
        uses: ./.github/actions/pinned-download
        with:
          url: ${{ env.SDL_URL }}
          sha256: ${{ env.SDL_SHA256 }}
          name: ${{ env.SDL_NAME }}

      - name: SDL3 headers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "${{ runner.workspace }}\sdl"
          Expand-Archive -Force "${{ steps.sdl-zip.outputs.file }}" $dir
          $env:KPP_SDL_INCLUDE = "$dir\SDL3-3.4.18\include"
          if (-not (Test-Path "$env:KPP_SDL_INCLUDE\SDL3\SDL.h")) { throw "no SDL3\SDL.h in $env:KPP_SDL_INCLUDE" }
          "KPP_SDL_INCLUDE=$env:KPP_SDL_INCLUDE" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the Clang component' }
          "KPP_CLANG=$vs\VC\Tools\Llvm\x64\bin\clang.exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "CPUs: $env:NUMBER_OF_PROCESSORS"

      - name: llvm-mingw cache
        if: matrix.config == 'windows-gnu'
        uses: actions/cache@v4
        with:
          path: build/llvm-mingw
          key: llvm-mingw-${{ hashFiles('tools/sysroot/llvm-mingw.ps1') }}

      - name: llvm-mingw
        if: matrix.config == 'windows-gnu'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = & tools\sysroot\llvm-mingw.ps1 | Select-Object -Last 1
          "KPP_CLANG=$root\bin\clang.exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: spec
        shell: cmd
        run: compiler\tests\spec.cmd --no-doc --shard ${{ matrix.shard }}/${{ matrix.config == 'debug' && 2 || 4 }} ${{ matrix.config == 'windows-gnu' && '--target windows-gnu --release' || matrix.config != 'debug' && format('--{0}', matrix.config) || '' }}

  # FreeBSD (docs/design.md, "Targets and hosts", stage 6): the spec built and linked for FreeBSD 14.3
  # here (run_spec.py --target freebsd, against tools\sysroot\freebsd.ps1's sysroot), then run in a
  # FreeBSD 14.3 VM (freebsd_run). On every run. The known failures (stages 3 and 4,
  # design.md) are compiler\tests\spec\freebsd-known-failures.txt: either job fails on a new failure,
  # and on a known one that works (its line must go). Both write their counts in the run's summary;
  # publish does not wait for them.
  freebsd_build:
    needs: build
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The two interop snippets that import SDL3/SDL.h, as the spec job has them (its SDL3 steps).
      SDL_NAME: SDL3-devel-3.4.18-VC.zip
      SDL_SHA256: 78d84602ae616cfe26b33a73b7d3b9b6b56e8a6650e53d92c9c6ca938f747acd
      SDL_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kpp
          path: compiler/build

      - name: SDL3's zip
        id: sdl-zip
        uses: ./.github/actions/pinned-download
        with:
          url: ${{ env.SDL_URL }}
          sha256: ${{ env.SDL_SHA256 }}
          name: ${{ env.SDL_NAME }}

      - name: SDL3 headers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "${{ runner.workspace }}\sdl"
          Expand-Archive -Force "${{ steps.sdl-zip.outputs.file }}" $dir
          $env:KPP_SDL_INCLUDE = "$dir\SDL3-3.4.18\include"
          if (-not (Test-Path "$env:KPP_SDL_INCLUDE\SDL3\SDL.h")) { throw "no SDL3\SDL.h in $env:KPP_SDL_INCLUDE" }
          "KPP_SDL_INCLUDE=$env:KPP_SDL_INCLUDE" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      # The sysroot, kept under the script's hash (which pins base.txz's SHA-256): a cache hit
      # downloads nothing from FreeBSD's archive.
      - name: FreeBSD sysroot cache
        uses: actions/cache@v4
        with:
          path: compiler/build/sysroots/freebsd-x86_64
          key: freebsd-sysroot-${{ hashFiles('tools/sysroot/freebsd.ps1') }}

      # Clang for the snippets' C sources, and llvm-objcopy beside it for the sysroot's script.
      - name: FreeBSD sysroot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the Clang component' }
          $env:KPP_CLANG = "$vs\VC\Tools\Llvm\x64\bin\clang.exe"
          "KPP_CLANG=$env:KPP_CLANG" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\sysroot\freebsd.ps1
          if ($LASTEXITCODE -ne 0) { throw 'tools\sysroot\freebsd.ps1 failed' }

      # A known build failure is listed as known, and the bundle has the snippets that linked. The step
      # fails on a new failure (or a known one that builds) after the bundle is uploaded, when
      # run_spec.py itself cannot run (exit code 2: no sysroot, no compiler), and when kpp crashes or
      # times out on a snippet.
      - name: spec built for FreeBSD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue' # (Actions' 'stop' would end the step on python's stderr)
          $out = & python -X utf8 -I compiler\tests\spec\run_spec.py --target freebsd 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out
          $crashes = @($out | Where-Object { $_ -match 'crashed|timed out' })
          @('### spec built for FreeBSD 14.3', '', '    ' + ($out | Select-Object -Last 1)) + @($crashes | ForEach-Object { "    $_" }) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($code -gt 1) { throw "run_spec.py --target freebsd: exit code $code" }
          if ($crashes.Count) { throw "kpp crashed or timed out on $($crashes.Count) snippet(s)" }
          # (exit 0 here: the upload runs first, and the step after it fails on run_spec.py's 1)
          "KPP_FREEBSD_BUILD=$code" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: spec-freebsd
          path: |
            compiler/build/spec-freebsd/run.sh
            compiler/build/spec-freebsd/known.txt
            compiler/build/spec-freebsd/*.elf
            compiler/build/spec-freebsd/*.expected
          retention-days: 3
          if-no-files-found: error

      - name: New build failures
        shell: powershell
        run: if ($env:KPP_FREEBSD_BUILD -ne '0') { throw 'snippets fail to build for FreeBSD that freebsd-known-failures.txt does not list, or listed ones build (spec built for FreeBSD, above)' }

  # The bundle in a FreeBSD 14.3 VM: vmactions/freebsd-vm (QEMU with KVM on the Ubuntu runner; v1.5.9,
  # pinned by its commit). It copies the workspace in and back with rsync and runs run.sh there; its
  # log comes back for the summary. The action downloads its own FreeBSD image (anyvm-org's, not
  # FreeBSD's), its scripts and SSH keys, none of them hash-checked: the job's token can only read.
  freebsd_run:
    needs: freebsd_build
    # (also after a new build failure there: the snippets that did build still run)
    if: ${{ !cancelled() && needs.freebsd_build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spec-freebsd
          path: spec-freebsd

      - name: spec on FreeBSD 14.3
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '14.3'
          sync: rsync
          copyback: true
          run: |
            freebsd-version
            sh spec-freebsd/run.sh > spec-freebsd/run.log 2>&1 || true
            cat spec-freebsd/run.log

      # The counts and the failures in the run's summary; the step fails unless run.sh reached its
      # last line and that says ALL PASSED (a VM that died has no last line).
      - name: Summary
        if: always()
        shell: bash
        run: |
          log=spec-freebsd/run.log
          last=$(tail -n 1 "$log" 2>/dev/null || true)
          [ -n "$last" ] || last='no result: run.sh did not finish (the VM step failed)'
          { echo '### spec on FreeBSD 14.3'; echo; echo "    $last"; grep -E '^(FAIL|FIXED)' "$log" 2>/dev/null | sed 's/^/    /' || true; } >> "$GITHUB_STEP_SUMMARY"
          case "$last" in "spec freebsd: ALL PASSED"*) ;; *) exit 1 ;; esac

  # macOS (docs/design.md, "Targets and hosts", stage 8): every snippet built for macos and macos-x64
  # here (run_spec.py --target macos, macos-x64) against the stand-in SDK beside the spec's
  # kpp/macos_sdk_checked_before_the_build.kpp, until CI has a real one (the macOS plan's M10, for
  # kovarex): its modules compiled to Mach-O objects, and linked by ld64.lld where the snippet brings a
  # stub SDK of its own (the stand-in's link is deferred: its libSystem.tbd lists only what the macOS
  # specs link). A snippet that imports C headers is skipped (the stand-in has none);
  # compiler\tests\spec\macos-known-failures.txt lists those known not to build. Fails on a new failure
  # and on a known one that builds. publish does not wait for it.
  macos_build:
    needs: build
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kpp
          path: compiler/build

      - name: spec built for macOS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue' # (Actions' 'stop' would end the step on python's stderr)
          $failed = @()
          foreach ($target in @('macos', 'macos-x64'))
          {
            $out = & python -X utf8 -I compiler\tests\spec\run_spec.py --target $target 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $out
            $crashes = @($out | Where-Object { $_ -match 'crashed|timed out' })
            @("### spec built for $target (Mach-O objects)", '', '    ' + ($out | Select-Object -Last 1)) + @($crashes | ForEach-Object { "    $_" }) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ($code -ne 0) { $failed += "$target (exit $code)" }
          }
          if ($failed.Count) { throw "run_spec.py failed for $($failed -join ', ')" }

  # The libraries' tests and kppsite's on FreeBSD (libraries/targets.md; kovarex, 2026-11-04: "If we
  # want to make sure freeBSD binaries are correct, it should be part of kpp workflow testing"): each
  # project's tests built for FreeBSD 14.3 here (libraries\target-tests.ps1: kpp --target freebsd
  # --no-run --test; a project that does not build fails unless target-known-failures.txt lists it),
  # then run in a FreeBSD 14.3 VM from the checkout (libraries_freebsd_run), httpclient's HTTPS test
  # included (EGD over TLS, an expired certificate refused). On every run, like the spec's FreeBSD
  # jobs; publish does not wait for them.
  libraries_freebsd_build:
    needs: build
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kpp
          path: compiler/build

      - name: FreeBSD sysroot cache
        uses: actions/cache@v4
        with:
          path: compiler/build/sysroots/freebsd-x86_64
          key: freebsd-sysroot-${{ hashFiles('tools/sysroot/freebsd.ps1') }}

      - name: FreeBSD sysroot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the Clang component' }
          $env:KPP_CLANG = "$vs\VC\Tools\Llvm\x64\bin\clang.exe"
          "KPP_CLANG=$env:KPP_CLANG" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\sysroot\freebsd.ps1
          if ($LASTEXITCODE -ne 0) { throw 'tools\sysroot\freebsd.ps1 failed' }

      # The bundle is uploaded whatever built; the step after it fails on a new build failure.
      - name: libraries built for FreeBSD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File libraries\target-tests.ps1 -Target freebsd 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out
          @('### libraries built for FreeBSD 14.3', '', '    ' + ($out | Select-Object -Last 1)) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "KPP_LIBRARIES_BUILD=$code" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: libraries-freebsd
          path: |
            compiler/build/libraries-freebsd/run.sh
            compiler/build/libraries-freebsd/projects.txt
            compiler/build/libraries-freebsd/*.elf
          retention-days: 3
          if-no-files-found: error

      - name: New build failures
        shell: powershell
        run: if ($env:KPP_LIBRARIES_BUILD -ne '0') { throw 'a library fails to build for FreeBSD that target-known-failures.txt does not list, or a listed one builds (libraries built for FreeBSD, above)' }

  # The bundle in a FreeBSD 14.3 VM, as freebsd_run, with the checkout beside it: the tests read files
  # of their projects (kppsite's fixture, json's suite).
  libraries_freebsd_run:
    needs: libraries_freebsd_build
    # (also after a new build failure there: the projects that did build still run)
    if: ${{ !cancelled() && needs.libraries_freebsd_build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libraries-freebsd
          path: libraries-freebsd

      - name: libraries on FreeBSD 14.3
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '14.3'
          sync: rsync
          copyback: true
          run: |
            freebsd-version
            HTTPCLIENT_TEST_HTTPS=1 sh libraries-freebsd/run.sh "$PWD" > libraries-freebsd/run.log 2>&1 || true
            cat libraries-freebsd/run.log

      # The step fails unless run.sh reached its last line and that says ALL PASSED.
      - name: Summary
        if: always()
        shell: bash
        run: |
          log=libraries-freebsd/run.log
          last=$(tail -n 1 "$log" 2>/dev/null || true)
          [ -n "$last" ] || last='no result: run.sh did not finish (the VM step failed)'
          { echo '### libraries on FreeBSD 14.3'; echo; echo "    $last"; grep -E '^FAIL' "$log" 2>/dev/null | sed 's/^/    /' || true; } >> "$GITHUB_STEP_SUMMARY"
          case "$last" in "libraries freebsd: ALL PASSED"*) ;; *) exit 1 ;; esac

  # On master, kpp is packaged while the tests run (kovarex, 2026-11-02), and handed to publish as
  # the artifact "package". Packaging publishes nothing.
  package:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sums: ${{ steps.package.outputs.sums }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kpp
          path: compiler/build

      # The bundled toolchain (tools\sysroot\llvm-mingw.ps1), which the package carries.
      - name: llvm-mingw cache
        uses: actions/cache@v4
        with:
          path: build/llvm-mingw
          key: llvm-mingw-${{ hashFiles('tools/sysroot/llvm-mingw.ps1') }}

      # FreeBSD 14.3's sysroot, which the package carries (sysroots\freebsd-x86_64; package.ps1 runs
      # tools\sysroot\freebsd.ps1): the freebsd_build job's cache, kept under the script's hash (which
      # pins base.txz's SHA-256), so that a hit downloads nothing from FreeBSD's archive.
      - name: FreeBSD sysroot cache
        uses: actions/cache@v4
        with:
          path: compiler/build/sysroots/freebsd-x86_64
          key: freebsd-sysroot-${{ hashFiles('tools/sysroot/freebsd.ps1') }}

      # The package's version is kpp's own (docs/build.md, "Versions": VERSION and the commits since it
      # changed), which package.ps1 takes from kpp --version; never "+dirty" or unknown here. A push
      # run's release is tagged v<version>; the nightly run's, of a commit a push run has released
      # already, nightly-<date> (UTC), the day's release, which tools/release/settle.ps1 never deletes (a
      # second nightly run on the same day replaces it).
      - name: Version
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $printed = @(& compiler\build\kpp.exe --version)
          if ($printed[0] -notmatch '^kpp (\d+\.\d+\.\d+), commit ${{ github.sha }}$') { throw "kpp's version is not a release's: $($printed[0])" }
          $version = $Matches[1]
          $tag = if ('${{ github.event_name }}' -eq 'schedule') { 'nightly-' + (Get-Date).ToUniversalTime().ToString('yyyyMMdd') } else { "v$version" }
          "KPP_VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "KPP_TAG=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "version=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "tag=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "version $version, tag $tag"
          "CPUs: $env:NUMBER_OF_PROCESSORS"
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'no Node.js on the runner (the package builds kpp-vscode.vsix)' }

      # Inno Setup's compiler, for the installer package.ps1 makes when it finds ISCC (as release.yml).
      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw 'no Inno Setup' }

      # (sums: each file's SHA-256, for publish's tools\release\check-files.ps1)
      - name: Package
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $started = Get-Date
          tools\release\package.ps1
          if (-not (Test-Path "build\release\kpp-$env:KPP_VERSION-setup.exe")) { throw 'no installer' }
          "packaging took $([int]((Get-Date) - $started).TotalSeconds) s"
          $files = "kpp-$env:KPP_VERSION.zip", "kpp-$env:KPP_VERSION-setup.exe", 'kpp/kpp-vscode.vsix', 'kpp/kpp-visualstudio.vsix'
          $sums = ($files | ForEach-Object { "$_=$((Get-FileHash -Algorithm SHA256 "build/release/$_").Hash.ToLowerInvariant())" }) -join ' '
          "sums=$sums" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            build/release/kpp-${{ steps.version.outputs.version }}.zip
            build/release/kpp-${{ steps.version.outputs.version }}-setup.exe
            build/release/kpp/kpp-vscode.vsix
            build/release/kpp/kpp-visualstudio.vsix
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  # kpp on a Linux host (docs/design.md, "Targets and hosts", 5), on ubuntu: kpp built with CMake,
  # clang 19, lld and Ninja, hello world and a project with C libraries built and run with kpp --run,
  # the spec's snippets built and run natively, and kpp's Linux release packaged
  # (tools/release/package-linux.sh), which publish uploads beside the Windows package (E, 2026-11-06;
  # it was linux-host.yml, a workflow of its own, while the Linux host was new).
  # kpp on a Linux host (ubuntu-24.04, 4 CPUs) in three parts, so that the spec's two configurations
  # do not run one after the other behind the build (2026-11-07: build 2-3 min, the spec 4-6 min and
  # its release 8-15 min made linux_host 19-26 min, every other job ending by 9): linux_build builds
  # kpp once and hands it on as the artifact kpp-linux-compiler; linux_spec runs the spec in debug
  # in 2 shards and in release in 4, at once; linux_host runs the smoke tests and packages
  # kpp's Linux release. Their tools (clang 19, lld; SDL3's headers) are .github/actions/linux-tools.
  linux_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The whole history: kpp's version counts the commits since VERSION last changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/linux-tools

      # Saved by this job alone: the key is the run's, which linux_spec's jobs would share.
      - name: Save the packages
        if: env.DEBS_FETCHED == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/debs
          key: linux-host-debs-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build kpp
        run: |
          cmake -S compiler -B compiler/build -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=Release "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          cmake --build compiler/build
          compiler/build/kpp --version

      # (upload-artifact drops the executable bit: the jobs taking it set it again)
      - uses: actions/upload-artifact@v4
        with:
          name: kpp-linux-compiler
          path: compiler/build/kpp
          if-no-files-found: error

  # The spec on a Linux host, in debug and in release (ThinLTO, lld's back ends, and code the optimizer
  # sees through: no other job ran it, and 12 snippets failed there on 2026-11-07, 10 noexcept snippets
  # caught where they must terminate; I's fix, found by hand): debug in 2 shards, release in 4 (each
  # took 4-6.5 min of spec in 1 and 3 shards on 2026-11-08, after linux_build's 2.7).
  linux_spec:
    needs: linux_build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: linux_spec ${{ matrix.config }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: debug, shard: 1/2, flags: '--shard 1/2' }
          - { config: debug, shard: 2/2, flags: '--shard 2/2' }
          - { config: release, shard: 1/4, flags: '--release --shard 1/4' }
          - { config: release, shard: 2/4, flags: '--release --shard 2/4' }
          - { config: release, shard: 3/4, flags: '--release --shard 3/4' }
          - { config: release, shard: 4/4, flags: '--release --shard 4/4' }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-tools

      - uses: actions/download-artifact@v4
        with:
          name: kpp-linux-compiler
          path: compiler/build

      - name: spec on a Linux host
        run: |
          chmod +x compiler/build/kpp
          python3 compiler/tests/spec/run_spec.py --jobs "$(nproc)" ${{ matrix.flags }}

  linux_host:
    needs: linux_build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sums: ${{ steps.package.outputs.sums }}
    steps:
      # The whole history, as linux_build's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/linux-tools

      - uses: actions/download-artifact@v4
        with:
          name: kpp-linux-compiler
          path: compiler/build

      - name: kpp
        run: |
          chmod +x compiler/build/kpp
          compiler/build/kpp --version

      # The program's output, its arguments and its exit code through kpp --run.
      - name: hello world
        run: |
          mkdir -p /tmp/hello
          printf 'int main(int argc, char** argv)\n{\n  std::println("hello from linux ", argc);\n  return 3;\n}\n' > /tmp/hello/hello.kpp
          set +e
          out=$(compiler/build/kpp --run /tmp/hello/hello.kpp a b)
          code=$?
          set -e
          echo "$out (exit $code)"
          [ "$out" = "hello from linux 3" ] && [ $code -eq 3 ]

      # kpp on a project with C libraries (tests/targets/clibrary: a C file, a C++ file, a define per
      # platform, Linux's own library with a sysroot include directory), built natively with clang 19
      # and llvm-ar beside it, in debug and in release (ThinLTO): `42 linux 10`.
      # The compile server on Linux (a Unix socket per key, server.cpp): a build through it, the same
      # again (replayed: its log says so), an edit (built again, the program prints the new text),
      # --stop-server (no server left).
      - name: the compile server
        run: |
          mkdir -p /tmp/served && cd /tmp/served
          kpp="$GITHUB_WORKSPACE/compiler/build/kpp"
          for text in one one two; do
            printf 'int main()\n{\n  std::println("%s");\n  return 0;\n}\n' "$text" > main.kpp
            "$kpp" --server --exe app main.kpp
            [ "$(./app)" = "$text" ]
          done
          grep -q "no input changed, the previous build's output sent again" /tmp/kpp-server-$(id -u)/*.log
          grep -q "incremental:" /tmp/kpp-server-$(id -u)/*.log
          "$kpp" --stop-server --exe app main.kpp | grep -q "compile server stopped"
          "$kpp" --stop-server --exe app main.kpp | grep -q "no compile server runs for these arguments"

      # The compile server's crash report on Linux: a request with KPP_SERVER_CRASH_TEST=1 crashes the
      # server on purpose; its client says so and builds in its own process; the server's log has the
      # signal and a stack naming the function that crashed.
      - name: the compile server's crash report
        run: |
          mkdir -p /tmp/crash && cd /tmp/crash
          printf 'int main()\n{\n  std::println("built");\n  return 0;\n}\n' > main.kpp
          KPP_SERVER_CRASH_TEST=1 "$GITHUB_WORKSPACE/compiler/build/kpp" --server --exe app main.kpp 2> err.txt
          [ "$(./app)" = "built" ]
          grep -q "the compile server ended without finishing the build" err.txt
          log=$(grep -l "crashing on purpose" /tmp/kpp-server-$(id -u)/*.log)
          grep "crashed in build\|^.*\]   " "$log"
          grep -q "crashed in build 1: signal 11" "$log"
          grep -q "kppServerCrashForTest" "$log"

      # The language server on Linux (tests/lsp_smoke.py): an error published at its place, none once
      # the file is fixed, shutdown and exit.
      - name: the language server
        run: python3 compiler/tests/lsp_smoke.py

      - name: a project with C libraries
        run: |
          cp -r compiler/tests/targets/clibrary /tmp/clibrary
          cd /tmp/clibrary
          for configuration in debug release; do
            out=$("$GITHUB_WORKSPACE/compiler/build/kpp" "$configuration" --run | tail -n 1)
            echo "$configuration: $out"
            [ "$out" = "42 linux 10" ]
          done

      # Windows programs from a Linux host (kovarex 2026-11-07: Factorio's Windows exe built on Linux):
      # llvm-mingw's Linux toolchain (tools/sysroot/llvm-mingw.sh, the bundled one's release, cached)
      # through KPP_CLANG, hello world and the C library project built for windows-gnu, whose Windows
      # library and C import include <WinSock2.h> and <Windows.h> as Windows code spells them, found in
      # MinGW-w64's lower-case headers without case (source.cpp's headerCaseOverlay). Not run: no Windows.
      - name: llvm-mingw cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-linux-20250114-${{ hashFiles('tools/sysroot/llvm-mingw.sh') }}

      - name: windows-gnu from a Linux host
        run: |
          root=$(sh tools/sysroot/llvm-mingw.sh "$RUNNER_TEMP/llvm-mingw" | tail -n 1)
          kpp="$GITHUB_WORKSPACE/compiler/build/kpp"
          KPP_CLANG="$root/bin/clang" "$kpp" --target windows-gnu --exe /tmp/hello/hello.exe /tmp/hello/hello.kpp
          file /tmp/hello/hello.exe | grep -q "PE32+ executable"
          cp -r compiler/tests/targets/clibrary /tmp/clibrary-gnu
          cd /tmp/clibrary-gnu
          for configuration in debug release; do
            KPP_CLANG="$root/bin/clang" "$kpp" "$configuration" --target windows-gnu
            file "build/$configuration/app.exe" | grep -q "PE32+ executable"
          done
          test -f build/release/app.pdb

      # kpp's Linux release (tools/release/package-linux.sh: the tarball, its smoke test outside the
      # repository), kept as this run's artifact. libstdc++ and libgcc are linked into kpp (above), so
      # it needs only glibc (2.39, this runner's) and the system's clang 19 and lld.
      - name: Package
        id: package
        run: |
          sh tools/release/package-linux.sh
          cd build/release
          file=$(ls kpp-*-linux-x86_64.tar.gz)
          echo "sums=$file=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kpp-linux
          path: build/release/kpp-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # kpp on Linux arm64 (I's step M1 of the macOS plan, 77a72c2c: `--target linux-arm64`), natively on
  # GitHub's ubuntu-24.04-arm runner (free, the repository being public): kpp built there with clang 19,
  # lld and Ninja, hello world and the C library project built and run with kpp --run, and the spec's
  # snippets built and run natively (run_spec.py takes an AArch64 host as linux-arm64: its `// arch:`
  # skips and .linux-arm64.expected files). publish does not wait for it, as for the FreeBSD jobs.
  linux_arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SDL_NAME: SDL3-devel-3.4.18-VC.zip
      SDL_SHA256: 78d84602ae616cfe26b33a73b7d3b9b6b56e8a6650e53d92c9c6ca938f747acd
      SDL_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (the .deb files kept as linux_host's are, under arm64's own key)
      - name: Packages cache
        uses: actions/cache/restore@v4
        with:
          path: ~/debs
          key: linux-arm64-debs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-arm64-debs-

      - name: Tools
        timeout-minutes: 30
        run: |
          apt="-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Keep-Downloaded-Packages=true"
          mkdir -p ~/debs
          if ls ~/debs/*.deb >/dev/null 2>&1 && timeout 300 sudo dpkg -i ~/debs/*.deb; then
            echo "installed from the cache: $(ls ~/debs | wc -l) packages"
          else
            for attempt in 1 2 3; do
              if timeout 300 sudo apt-get update $apt && timeout 600 sudo apt-get install -y $apt clang-19 lld-19 ninja-build cmake; then break; fi
              [ "$attempt" -lt 3 ] || { echo "apt-get failed 3 times"; exit 1; }
              echo "apt-get attempt $attempt failed; again in 30 s"
              sleep 30
            done
            rm -f ~/debs/*.deb
            cp /var/cache/apt/archives/*.deb ~/debs/
            echo "DEBS_FETCHED=1" >> "$GITHUB_ENV"
          fi
          echo "KPP_CLANG=/usr/bin/clang-19" >> "$GITHUB_ENV"
          clang-19 --version | head -n 2
          echo "CPUs: $(nproc), $(uname -m)"

      - name: Save the packages
        if: env.DEBS_FETCHED == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/debs
          key: linux-arm64-debs-${{ github.run_id }}-${{ github.run_attempt }}

      - name: SDL3's zip
        id: sdl-zip
        uses: ./.github/actions/pinned-download
        with:
          url: ${{ env.SDL_URL }}
          sha256: ${{ env.SDL_SHA256 }}
          name: ${{ env.SDL_NAME }}

      - name: SDL3 headers
        run: |
          dir="$RUNNER_TEMP/sdl"
          mkdir -p "$dir"
          unzip -q "${{ steps.sdl-zip.outputs.file }}" 'SDL3-3.4.18/include/*' -d "$dir"
          test -f "$dir/SDL3-3.4.18/include/SDL3/SDL.h"
          echo "KPP_SDL_INCLUDE=$dir/SDL3-3.4.18/include" >> "$GITHUB_ENV"

      - name: Build kpp
        run: |
          cmake -S compiler -B compiler/build -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=Release "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          cmake --build compiler/build
          compiler/build/kpp --version

      - name: hello world
        run: |
          mkdir -p /tmp/hello
          printf 'int main(int argc, char** argv)\n{\n  std::println("hello from ", config::arch == Arch::Arm64 ? std::StringView("arm64") : std::StringView("another"), " ", argc);\n  return 3;\n}\n' > /tmp/hello/hello.kpp
          set +e
          out=$(compiler/build/kpp --run /tmp/hello/hello.kpp a b)
          code=$?
          set -e
          echo "$out (exit $code)"
          [ "$out" = "hello from arm64 3" ] && [ $code -eq 3 ]

      - name: a project with C libraries
        run: |
          cp -r compiler/tests/targets/clibrary /tmp/clibrary
          cd /tmp/clibrary
          for configuration in debug release; do
            out=$("$GITHUB_WORKSPACE/compiler/build/kpp" "$configuration" --run | tail -n 1)
            echo "$configuration: $out"
            [ "$out" = "42 linux 10" ]
          done

      - name: spec on Linux arm64
        run: python3 compiler/tests/spec/run_spec.py --jobs "$(nproc)"

  # Publishes the package, only when the jobs it needs are green: run_tests' halves, every spec shard,
  # package, linux_spec and linux_host. If one of them is red or cancelled it publishes nothing: no release, no
  # tag, no kpp.net upload, and Latest stays where it was. It does not wait for the FreeBSD jobs
  # (freebsd_build, freebsd_run, libraries_freebsd_build, libraries_freebsd_run) or macos_build: a red
  # one of those alone does not stop a release.
  publish:
    needs: [run_tests, spec, package, linux_spec, linux_host]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ${{ vars.KPP_CI_RUNNER || 'windows-2022' }}
    timeout-minutes: 30
    env:
      KPP_VERSION: ${{ needs.package.outputs.version }}
      KPP_TAG: ${{ needs.package.outputs.tag }}
      KPP_SUMS: ${{ needs.package.outputs.sums }} ${{ needs.linux_host.outputs.sums }}
    steps:
      - uses: actions/checkout@v4

      # The artifacts, checked against the SHA-256 their jobs wrote and downloaded once more if they
      # differ: on 2026-11-06 (run 42236543487) download-artifact ended with no error after 50 MB of a
      # 116 MB zip. A second difference fails the next step, and nothing is published.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: package
          path: build/release

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kpp-linux
          path: build/release

      - name: The downloaded files
        id: downloaded
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\release\check-files.ps1 -Dir build\release -Sums $env:KPP_SUMS
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Start the download again
        if: steps.downloaded.outcome == 'failure'
        shell: powershell
        run: Remove-Item -Recurse -Force build\release

      - uses: actions/download-artifact@v4
        if: steps.downloaded.outcome == 'failure'
        continue-on-error: true
        with:
          name: package
          path: build/release

      - uses: actions/download-artifact@v4
        if: steps.downloaded.outcome == 'failure'
        continue-on-error: true
        with:
          name: kpp-linux
          path: build/release

      - name: The package's files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\release\check-files.ps1 -Dir build\release -Sums $env:KPP_SUMS
          if ($LASTEXITCODE -ne 0) { throw 'the artifacts are not the files their jobs built' }
          foreach ($f in "build\release\kpp-$env:KPP_VERSION.zip", "build\release\kpp-$env:KPP_VERSION-setup.exe", "build\release\kpp\kpp-vscode.vsix", "build\release\kpp\kpp-visualstudio.vsix", "build\release\kpp-$env:KPP_VERSION-linux-x86_64.tar.gz") {
            if (-not (Test-Path $f)) { throw "no $f in the artifact package" }
            "$f $((Get-Item $f).Length) bytes"
          }

      # The package, through tools/release/publish.ps1: the forge's full release $KPP_TAG, made at this
      # commit through the forge's API (GitHub's, or Forgejo's when github.api_url ends in /api/v1),
      # and kpp.net's kpp/releases/<version>/ with kpp/latest.json, which installers read (only with
      # KPP_NET_SSH_KEY). It is published without becoming "Latest"; the next step decides that.
      - name: Publish
        shell: powershell
        env:
          KPP_FORGE_TOKEN: ${{ github.token }}
          KPP_NET_SSH_KEY: ${{ secrets.KPP_NET_SSH_KEY }}
          KPP_NET_KNOWN_HOSTS: ${{ vars.KPP_NET_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:KPP_VERSION
          $title = if ('${{ github.event_name }}' -eq 'schedule') { "kpp $v (nightly $($env:KPP_TAG.Substring(8)))" } else { "kpp $v" }
          $tested = 'every test green, including the --release and --debug-info spec'
          tools\release\publish.ps1 -ApiUrl "${{ github.api_url }}" -Repository "${{ github.repository }}" -Tag $env:KPP_TAG -Commit "${{ github.sha }}" -MakeLatest false `
            -Version $v -KppNet "${{ vars.KPP_NET_SSH }}" -Title $title `
            -Notes "Built by ci run ${{ github.run_number }} from ${{ github.sha }}, $tested. Install with kpp-$v-setup.exe (Program Files\kpp, on PATH), or unzip kpp-$v.zip anywhere. Needs nothing else: it brings its own toolchain (llvm-mingw: clang, lld, MinGW-w64), and its programs use only Windows' own DLLs. kpp-vscode.vsix is the VS Code extension: the installer offers it, or run code --install-extension kpp-vscode.vsix (a double-click opens Visual Studio's installer, which does not take it). kpp-visualstudio.vsix is the Visual Studio 2022 extension (17.14 or later): the installer offers it, or open it. kpp-$v-linux-x86_64.tar.gz is kpp for Linux x86-64: unpack it anywhere; it needs glibc 2.39 or later and the system's clang 19 and lld." `
            -Files "build\release\kpp-$v.zip", "build\release\kpp-$v-setup.exe", "build\release\kpp\kpp-vscode.vsix", "build\release\kpp\kpp-visualstudio.vsix", "build\release\kpp-$v-linux-x86_64.tar.gz"

      # The release of the highest version (compared as numbers) becomes "Latest", so an older commit's
      # run that finishes after a newer one's (triggers have concurrency groups of their own) never
      # moves it back; push releases beyond the 20 highest versions are deleted with their tags,
      # nightly ones stay (tools/release/settle.ps1).
      - name: Latest and old releases
        shell: powershell
        env:
          KPP_FORGE_TOKEN: ${{ github.token }}
        run: tools\release\settle.ps1 -ApiUrl "${{ github.api_url }}" -Repository "${{ github.repository }}" -Keep 50
