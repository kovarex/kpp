# A kpp release, started by hand (Actions > release > Run workflow; docs/build.md, "Installing"):
# kppc built on a Windows runner, packaged by tools/release/package.ps1 (which builds a new project
# with the package as its smoke test), the installer made with Inno Setup, and both published as a
# prerelease named after the run: build-<run number>. Manual only until a run has been checked: master
# gets dozens of commits a day and Windows runners of a private repository bill at a multiplier; an
# automatic trigger (per tag, or nightly) comes after.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

# Threads push many commits a day: a newer commit's run replaces an older one still running.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      # The whole history: kpp's version counts the commits since VERSION last changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build kppc
        shell: cmd
        run: compiler\build.cmd

      # For the VS Code extension (tools/vscode: npm ci, vsce).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Package
        shell: pwsh
        run: |
          tools\release\package.ps1
          $version = (& compiler\build\kppc.exe --version | Select-Object -First 1) -replace '^kpp (\S+), commit .*$', '$1'
          "KPP_VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: kpp ${{ env.KPP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Built from ${{ github.sha }}. Install with kpp-${{ env.KPP_VERSION }}-setup.exe (Program Files\kpp, on PATH), or unzip kpp-${{ env.KPP_VERSION }}.zip anywhere.
            Needs nothing else: it brings its own toolchain (llvm-mingw: clang, lld, MinGW-w64), and its programs use only Windows' own DLLs.
            kpp.vsix is the VS Code extension (the installer offers it; or code --install-extension kpp.vsix).
          files: |
            build/release/kpp-${{ env.KPP_VERSION }}.zip
            build/release/kpp-${{ env.KPP_VERSION }}-setup.exe
            build/release/kpp/kpp.vsix
