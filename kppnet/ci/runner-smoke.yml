# The Windows runner's acceptance test (RUNBOOK.md, step 7): copy to .forgejo/workflows/smoke.yml
# of a scratch repository on git.kpp.net (kpp/runner-smoke), push, and watch it under Actions. It
# checks each thing ci.yml relies on, one step each, so a failure names the missing piece.
name: runner-smoke
on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4          # resolves to git.kpp.net/actions/checkout (DEFAULT_ACTIONS_URL=self)

      - name: github context and GITHUB_ENV, as ci.yml uses them
        shell: pwsh
        run: |
          "sha=${{ github.sha }} run=${{ github.run_number }} event=${{ github.event_name }} ref=${{ github.ref }}"
          "workspace=${{ github.workspace }} server=${{ github.server_url }}"
          "SMOKE=ok" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: GITHUB_ENV reached the next step
        shell: pwsh
        run: if ($env:SMOKE -ne "ok") { throw "GITHUB_ENV did not carry over" }

      - name: cmd shell and Visual Studio with clang (compiler\build.cmd's lookup)
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          where python git node

      - uses: actions/cache@v4
        with:
          path: smoke-cache
          key: smoke-${{ github.run_id }}
          restore-keys: smoke-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
